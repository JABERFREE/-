<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>أحمد كات للخدمات اللوجستية</title>
    
    <!-- تنسيقات الهاتف والشاشة لضمان ظهور التصميم بشكل مثالي -->
  <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #0b132b;
        color: #ffffff;
        direction: rtl;
        text-align: right;
      }

      /* تنسيق الكمبيوتر الافتراضي (واسع ومنظم) */
      .header {
        background-color: #0b132b;
        padding: 1.2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1c2541;
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .logo-area h1 {
        font-size: 1.2rem;
        font-weight: bold;
        color: #ffffff;
      }

      .logo-area p {
        font-size: 0.75rem;
        color: #ffb703;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .nav-links {
        display: flex;
        gap: 20px;
      }

      .hero-section {
        background: linear-gradient(rgba(11, 19, 43, 0.85), rgba(11, 19, 43, 0.95)), 
                    url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1600&q=80') center/cover;
        padding: 5rem 2rem;
      }

      .hero-content {
        max-width: 600px;
      }

      .hero-content h2 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        color: #ffffff;
        line-height: 1.3;
      }

      .hero-content p {
        font-size: 1.1rem;
        color: #cbd5e1;
        margin-bottom: 2rem;
        line-height: 1.5;
      }

      .start-btn {
        background-color: #ffb703;
        color: #0b132b;
        padding: 10px 24px;
        border-radius: 4px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
      }

      .sectors-section {
        background-color: #ffffff;
        color: #0b132b;
        padding: 4rem 2rem;
      }

      /* تنسيق خاص للهواتف فقط (عندما تكون الشاشة أصغر من 768 بكسل) */
      @media (max-width: 768px) {
        .header {
          padding: 1rem;
          flex-direction: column;
          gap: 15px;
        }

        .nav-links {
          display: none !important; /* إخفاء الروابط المزدحمة على الهاتف فقط */
        }

        .hero-section {
          padding: 3rem 1.2rem;
          text-align: center;
        }

        .hero-content h2 {
          font-size: 1.8rem;
        }

        .hero-content p {
          font-size: 1rem;
        }
      }
    </style>
